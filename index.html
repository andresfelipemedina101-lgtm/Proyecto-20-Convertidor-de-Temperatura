
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertidor de temperatura</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <h1>Convertidor de temperatura</h1>

    <form id="formulario">

        <label for="temperatura">Temperatura:</label>
        <input type="number" id="temperatura" step="any" placeholder="Ingrese un valor">

        <label for="origen">Unidad de origen:</label>
        <select id="origen">
            <option value="">Seleccione una unidad</option>
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>

        <label for="destino">Unidad de destino:</label>
        <select id="destino">
            <option value="">Seleccione una unidad</option>
            <option value="C">Celsius (°C)</option>
            <option value="F">Fahrenheit (°F)</option>
            <option value="K">Kelvin (K)</option>
        </select>

        <button type="submit" id="convertir" disabled>Convertir</button>

    </form>

    <div id="resultado"></div>

    <script src="js/script.js"></script>
</body>
</html>
